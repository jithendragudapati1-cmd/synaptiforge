services:
  synaptiforge:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.production
    environment:
      SYNAPTIFORGE_ENV: production
      SYNAPTIFORGE_STORAGE_DIR: /var/lib/synaptiforge
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - synaptiforge-data:/var/lib/synaptiforge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  synaptiforge-data:
